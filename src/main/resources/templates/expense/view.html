<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Expense Details - Smart Expense')}"></head>
<body>
<div class="app-container d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('expenses')}"></div>
    <div class="main-wrapper flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Expense Details')}"></div>
        <main class="content" data-testid="view-expense-page">
            <div class="card" style="max-width: 720px;">
                <div class="card-header d-flex align-items-center">
                    <span><i class="bi bi-receipt me-2"></i><span th:text="${expense.title}">Title</span></span>
                    <span class="pill pill-accent ms-auto amount"
                          th:text="'₹' + ${#numbers.formatDecimal(expense.amount, 1, 'COMMA', 2, 'POINT')}">₹0</span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted-2">Amount</dt>
                        <dd class="col-sm-8 amount" th:text="'₹' + ${#numbers.formatDecimal(expense.amount, 1, 'COMMA', 2, 'POINT')}">₹0</dd>

                        <dt class="col-sm-4 text-muted-2">Expense Date</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(expense.expenseDate, 'dd/MM/yyyy')}">01/01/2026</dd>

                        <dt class="col-sm-4 text-muted-2">Category</dt>
                        <dd class="col-sm-8"><span class="pill" th:text="${expense.category.name}">Cat</span></dd>

                        <dt class="col-sm-4 text-muted-2">Payment Method</dt>
                        <dd class="col-sm-8" th:text="${expense.paymentMethod.name}">UPI</dd>

                        <dt class="col-sm-4 text-muted-2">Merchant Name</dt>
                        <dd class="col-sm-8" th:text="${expense.merchantName != null and !expense.merchantName.isEmpty()} ? ${expense.merchantName} : '—'">—</dd>

                        <dt class="col-sm-4 text-muted-2">Description</dt>
                        <dd class="col-sm-8" th:text="${expense.description != null and !expense.description.isEmpty()} ? ${expense.description} : '—'">—</dd>

                        <dt class="col-sm-4 text-muted-2">Created</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(expense.createdAt, 'dd/MM/yyyy HH:mm')}">—</dd>

                        <dt class="col-sm-4 text-muted-2">Last Updated</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(expense.updatedAt, 'dd/MM/yyyy HH:mm')}">—</dd>
                    </dl>
                    <div class="d-flex gap-2 mt-4">
                        <a th:href="@{'/expenses/' + ${expense.id} + '/edit'}" class="btn btn-primary" data-testid="edit-btn">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </a>
                        <a th:href="@{/expenses}" class="btn btn-outline-light" data-testid="back-btn">
                            <i class="bi bi-arrow-left me-1"></i>Back to List
                        </a>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
