spring.application.name=smart-expense-manager

# =========================================================
# PostgreSQL DataSource
# =========================================================

#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker_wqzn}
#spring.datasource.username=${DB_USERNAME:shrikant}
#spring.datasource.password=${DB_PASSWORD:3qUYIAITA0tjIuuyhmJveEE8cRz2B9Ue}
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Thymeleaf
# =========================================================

spring.thymeleaf.cache=false

# =========================================================
# Server
# =========================================================

server.port=${SERVER_PORT:8080}
server.error.whitelabel.enabled=false

# =========================================================
# Logging
# =========================================================

logging.level.com.smartexpense=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate.SQL=DEBUG