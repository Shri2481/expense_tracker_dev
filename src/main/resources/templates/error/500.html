<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error - Smart Expense')}"></head>
<body>
<div class="app-container d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('')}"></div>
    <div class="main-wrapper flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Something went wrong')}"></div>
        <main class="content">
            <div class="card">
                <div class="card-body empty-state">
                    <i class="bi bi-exclamation-octagon d-block mb-3" style="color: var(--danger);"></i>
                    <h3>500 &ndash; Application Error</h3>
                    <p th:text="${message} ?: 'An unexpected error occurred. Please try again.'">Error</p>
                    <a th:href="@{/dashboard}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
