<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Expenses - Smart Expense')}"></head>
<body>
<div class="app-container d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('expenses')}"></div>
    <div class="main-wrapper flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Expenses')}"></div>
        <main class="content" data-testid="expense-list-page">
            <div th:replace="~{fragments/toast :: toast}"></div>

            <!-- Search + Filters -->
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" th:action="@{/expenses}" data-testid="filter-form">
                        <input type="hidden" name="size" th:value="${size}">
                        <div class="row g-3 align-items-end">
                            <div class="col-12 col-lg-4">
                                <label class="form-label">Search</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border); color: var(--muted);">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text" name="query" th:value="${query}" class="form-control border-start-0"
                                           placeholder="Search by title or merchant..." data-testid="search-input">
                                </div>
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">Category</label>
                                <select name="categoryId" class="form-select" data-testid="filter-category">
                                    <option value="">All</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                            th:selected="${categoryId != null and categoryId == c.id}"></option>
                                </select>
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">Payment</label>
                                <select name="paymentMethodId" class="form-select" data-testid="filter-payment">
                                    <option value="">All</option>
                                    <option th:each="p : ${paymentMethods}" th:value="${p.id}" th:text="${p.name}"
                                            th:selected="${paymentMethodId != null and paymentMethodId == p.id}"></option>
                                </select>
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">From</label>
                                <input type="date" name="fromDate" th:value="${fromDate}" class="form-control" data-testid="filter-from">
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">To</label>
                                <input type="date" name="toDate" th:value="${toDate}" class="form-control" data-testid="filter-to">
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button type="submit" class="btn btn-primary" data-testid="apply-filters-btn">
                                    <i class="bi bi-funnel me-1"></i>Apply
                                </button>
                                <a th:href="@{/expenses}" class="btn btn-outline-light" data-testid="clear-filters-btn">
                                    <i class="bi bi-x-lg me-1"></i>Clear
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Excel export -->
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" th:action="@{/expenses/export/excel}" class="row g-3 align-items-end" data-testid="export-form">
                        <div class="col-auto">
                            <label class="form-label">Year</label>
                            <input type="number" name="year" class="form-control" style="width: 120px;"
                                   th:value="${currentYear}" min="1970" max="9999" data-testid="export-year">
                        </div>
                        <div class="col-auto">
                            <label class="form-label">Month</label>
                            <select name="month" class="form-select" data-testid="export-month">
                                <option th:each="m : ${months}" th:value="${m.value}" th:text="${m.name}"
                                        th:selected="${m.value == currentMonth}"></option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-outline-light" data-testid="download-excel-btn">
                                <i class="bi bi-file-earmark-excel me-1"></i>Download Excel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Expense table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle" data-testid="expense-table">
                        <thead>
                        <tr>
                            <th>Title</th>
                            <th class="text-end">Amount</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Payment</th>
                            <th>Merchant</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${expenses}" th:attr="data-testid='expense-row-' + ${e.id}">
                            <td th:text="${e.title}">Title</td>
                            <td class="text-end amount" th:text="'₹' + ${#numbers.formatDecimal(e.amount, 1, 'COMMA', 2, 'POINT')}">₹0</td>
                            <td th:text="${#temporals.format(e.expenseDate, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td><span class="pill" th:text="${e.category.name}">Cat</span></td>
                            <td class="text-muted-2" th:text="${e.paymentMethod.name}">UPI</td>
                            <td class="text-muted-2" th:text="${e.merchantName != null and !e.merchantName.isEmpty()} ? ${e.merchantName} : '—'">—</td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{'/expenses/' + ${e.id}}" class="btn btn-outline-light btn-icon" title="View"
                                       th:attr="data-testid='view-btn-' + ${e.id}"><i class="bi bi-eye"></i></a>
                                    <a th:href="@{'/expenses/' + ${e.id} + '/edit'}" class="btn btn-outline-light btn-icon" title="Edit"
                                       th:attr="data-testid='edit-btn-' + ${e.id}"><i class="bi bi-pencil"></i></a>
                                    <button type="button" class="btn btn-danger btn-icon" title="Delete"
                                            data-bs-toggle="modal" data-bs-target="#deleteExpenseModal"
                                            th:attr="data-action=@{'/expenses/' + ${e.id} + '/delete'}, data-label=${e.title}, data-testid='delete-btn-' + ${e.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${expenses.isEmpty()}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="bi bi-inbox d-block mb-2"></i>
                                    No expenses found. Try adjusting filters or add a new expense.
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination + page size -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-3">
                <div class="d-flex align-items-center gap-2 text-muted-2">
                    <span>Rows per page</span>
                    <form method="get" th:action="@{/expenses}" class="d-inline">
                        <input type="hidden" name="query" th:value="${query}">
                        <input type="hidden" name="categoryId" th:value="${categoryId}">
                        <input type="hidden" name="paymentMethodId" th:value="${paymentMethodId}">
                        <input type="hidden" name="fromDate" th:value="${fromDate}">
                        <input type="hidden" name="toDate" th:value="${toDate}">
                        <select name="size" class="form-select form-select-sm" style="width: 80px;"
                                onchange="this.form.submit()" data-testid="page-size-select">
                            <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}"></option>
                        </select>
                    </form>
                    <span th:text="'Showing ' + ${expensePage.numberOfElements} + ' of ' + ${expensePage.totalElements}">Showing 0</span>
                </div>

                <nav th:if="${expensePage.totalPages > 1}">
                    <ul class="pagination mb-0" data-testid="pagination">
                        <li class="page-item" th:classappend="${expensePage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/expenses(query=${query},categoryId=${categoryId},paymentMethodId=${paymentMethodId},fromDate=${fromDate},toDate=${toDate},size=${size},page=${expensePage.number - 1})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, expensePage.totalPages - 1)}"
                            th:classappend="${i == expensePage.number} ? 'active'">
                            <a class="page-link" th:text="${i + 1}"
                               th:href="@{/expenses(query=${query},categoryId=${categoryId},paymentMethodId=${paymentMethodId},fromDate=${fromDate},toDate=${toDate},size=${size},page=${i})}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${expensePage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/expenses(query=${query},categoryId=${categoryId},paymentMethodId=${paymentMethodId},fromDate=${fromDate},toDate=${toDate},size=${size},page=${expensePage.number + 1})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- Delete modal -->
<div class="modal fade" id="deleteExpenseModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: var(--surface); color: var(--text); border: 1px solid var(--border);">
            <div class="modal-header" style="border-color: var(--border);">
                <h5 class="modal-title">Delete Expense</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete "<strong data-delete-label>this expense</strong>"? This cannot be undone.
            </div>
            <div class="modal-footer" style="border-color: var(--border);">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                <form method="post" action="">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger" data-testid="confirm-delete-btn">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
