<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar(title)" class="topbar">
    <button class="btn btn-outline-light btn-icon mobile-toggle" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-label="Menu">
        <i class="bi bi-list"></i>
    </button>
    <h1 th:text="${title}">Page</h1>
    <div class="ms-auto d-flex align-items-center gap-2">
        <a th:href="@{/expenses/add}" class="btn btn-primary" data-testid="topbar-add-expense">
            <i class="bi bi-plus-lg me-1"></i><span class="d-none d-sm-inline">Add Expense</span>
        </a>
        <div class="dropdown">
            <button class="btn btn-outline-light d-flex align-items-center gap-2" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false" data-testid="user-menu">
                <i class="bi bi-person-circle"></i>
                <span class="d-none d-sm-inline" sec:authentication="name">user</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end auth-dropdown">
                <li>
                    <span class="dropdown-item-text">
                        Signed in as <strong sec:authentication="name">user</strong>
                    </span>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" th:action="@{/logout}">
                        <button type="submit" class="dropdown-item" data-testid="logout-btn">
                            <i class="bi bi-box-arrow-right me-2"></i>Sign out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
