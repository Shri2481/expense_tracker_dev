<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Categories - Smart Expense')}"></head>
<body>
<div class="app-container d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('categories')}"></div>
    <div class="main-wrapper flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Categories')}"></div>
        <main class="content" data-testid="category-page">
            <div th:replace="~{fragments/toast :: toast}"></div>

            <div class="row g-3">
                <!-- Add / Edit form -->
                <div class="col-12 col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-plus-circle me-2"></i>
                            <span th:text="${category.id != null} ? 'Edit Category' : 'Add Category'">Add Category</span>
                        </div>
                        <div class="card-body">
                            <form method="post"
                                  th:action="${category.id != null} ? @{'/categories/' + ${category.id}} : @{/categories}"
                                  th:object="${category}" novalidate data-testid="category-form">
                                <div class="mb-3">
                                    <label class="form-label">Category Name *</label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                           placeholder="e.g. Groceries" data-testid="input-category-name">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea th:field="*{description}" class="form-control" rows="3"
                                              placeholder="Optional" data-testid="input-category-description"></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary" data-testid="save-category-btn">
                                        <i class="bi bi-check-lg me-1"></i>
                                        <span th:text="${category.id != null} ? 'Update' : 'Save'">Save</span>
                                    </button>
                                    <a th:if="${category.id != null}" th:href="@{/categories}" class="btn btn-outline-light">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Category list -->
                <div class="col-12 col-lg-8">
                    <div class="card">
                        <div class="card-header"><i class="bi bi-tags me-2"></i>All Categories</div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle" data-testid="category-table">
                                <thead>
                                <tr>
                                    <th>Category Name</th>
                                    <th>Description</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="c : ${categories}" th:attr="data-testid='category-row-' + ${c.id}">
                                    <td><span class="pill" th:text="${c.name}">Name</span></td>
                                    <td class="text-muted-2" th:text="${c.description != null and !c.description.isEmpty()} ? ${c.description} : '—'">—</td>
                                    <td class="text-end">
                                        <div class="d-inline-flex gap-1">
                                            <a th:href="@{'/categories/' + ${c.id} + '/edit'}" class="btn btn-outline-light btn-icon" title="Edit"
                                               th:attr="data-testid='edit-category-' + ${c.id}"><i class="bi bi-pencil"></i></a>
                                            <button type="button" class="btn btn-danger btn-icon" title="Delete"
                                                    data-bs-toggle="modal" data-bs-target="#deleteCategoryModal"
                                                    th:attr="data-action=@{'/categories/' + ${c.id} + '/delete'}, data-label=${c.name}, data-testid='delete-category-' + ${c.id}">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${categories.isEmpty()}">
                                    <td colspan="3">
                                        <div class="empty-state">
                                            <i class="bi bi-tags d-block mb-2"></i>No categories yet
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- Delete modal -->
<div class="modal fade" id="deleteCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: var(--surface); color: var(--text); border: 1px solid var(--border);">
            <div class="modal-header" style="border-color: var(--border);">
                <h5 class="modal-title">Delete Category</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete "<strong data-delete-label>this category</strong>"?
            </div>
            <div class="modal-footer" style="border-color: var(--border);">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                <form method="post" action="">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger" data-testid="confirm-delete-category-btn">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:if="${openForm}">
    // keep the form area visible after a validation error on mobile
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.querySelector('[data-testid="category-form"]');
        if (form) form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
</script>
</body>
</html>
