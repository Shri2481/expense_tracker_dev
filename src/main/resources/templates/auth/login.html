<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign In - Smart Expense')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card" data-testid="login-card">
        <div class="auth-brand">
            <div class="auth-brand-mark"><i class="bi bi-wallet2"></i></div>
            <div>
                <p class="auth-brand-title">Smart Expense</p>
                <span class="auth-brand-sub">Manager</span>
            </div>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to continue to your dashboard</p>

        <div th:if="${param.error}" class="app-alert error mb-3" data-testid="login-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Invalid username or password</span>
        </div>
        <div th:if="${param.logout}" class="app-alert success mb-3" data-testid="logout-success">
            <i class="bi bi-check-circle-fill"></i>
            <span>You have been signed out</span>
        </div>
        <div th:if="${param.registered}" class="app-alert success mb-3" data-testid="registered-success">
            <i class="bi bi-check-circle-fill"></i>
            <span>Account created. Please sign in.</span>
        </div>

        <form method="post" th:action="@{/login}" data-testid="login-form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Enter your username" autofocus required
                           data-testid="input-username">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="Enter your password" required
                           data-testid="input-password">
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"
                           data-testid="remember-me">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" data-testid="login-submit">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
        </form>

        <p class="auth-foot">Don't have an account?
            <a th:href="@{/register}" data-testid="go-register">Create one</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
