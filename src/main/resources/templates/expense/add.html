<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Add Expense - Smart Expense')}"></head>
<body>
<div class="app-container d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('expenses')}"></div>
    <div class="main-wrapper flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Add Expense')}"></div>
        <main class="content" data-testid="add-expense-page">
            <div class="card" style="max-width: 820px;">
                <div class="card-header"><i class="bi bi-plus-circle me-2"></i>New Expense</div>
                <div class="card-body">
                    <form method="post" th:action="@{/expenses}" th:object="${expense}" novalidate data-testid="expense-form">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label">Title *</label>
                                <input type="text" th:field="*{title}" class="form-control"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="e.g. Grocery Shopping" data-testid="input-title">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Amount (₹) *</label>
                                <input type="number" step="0.01" th:field="*{amount}" class="form-control"
                                       th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                                       placeholder="0.00" data-testid="input-amount">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Expense Date *</label>
                                <input type="date" th:field="*{expenseDate}" class="form-control"
                                       th:classappend="${#fields.hasErrors('expenseDate')} ? 'is-invalid'" data-testid="input-date">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Merchant Name</label>
                                <input type="text" th:field="*{merchantName}" class="form-control"
                                       placeholder="e.g. Reliance Smart" data-testid="input-merchant">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Category *</label>
                                <select th:field="*{categoryId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'" data-testid="select-category">
                                    <option value="">Select category</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Payment Method *</label>
                                <select th:field="*{paymentMethodId}" class="form-select"
                                        th:classappend="${#fields.hasErrors('paymentMethodId')} ? 'is-invalid'" data-testid="select-payment">
                                    <option value="">Select payment method</option>
                                    <option th:each="p : ${paymentMethods}" th:value="${p.id}" th:text="${p.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('paymentMethodId')}" th:errors="*{paymentMethodId}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Optional notes..." data-testid="input-description"></textarea>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" data-testid="save-expense-btn">
                                <i class="bi bi-check-lg me-1"></i>Save Expense
                            </button>
                            <a th:href="@{/expenses}" class="btn btn-outline-light" data-testid="cancel-btn">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
