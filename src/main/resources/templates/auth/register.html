<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Account - Smart Expense')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card" data-testid="register-card">
        <div class="auth-brand">
            <div class="auth-brand-mark"><i class="bi bi-wallet2"></i></div>
            <div>
                <p class="auth-brand-title">Smart Expense</p>
                <span class="auth-brand-sub">Manager</span>
            </div>
        </div>

        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start tracking your expenses in minutes</p>

        <div th:if="${error}" class="app-alert error mb-3" data-testid="register-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}">Error</span>
        </div>

        <form method="post" th:action="@{/register}" th:object="${registerDTO}" novalidate
              data-testid="register-form">
            <div class="mb-3">
                <label class="form-label">Username *</label>
                <div class="input-group" th:classappend="${#fields.hasErrors('username')} ? 'has-validation'">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           placeholder="Choose a username" data-testid="input-reg-username">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email *</label>
                <div class="input-group" th:classappend="${#fields.hasErrors('email')} ? 'has-validation'">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           placeholder="you@example.com" data-testid="input-reg-email">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password *</label>
                <div class="input-group" th:classappend="${#fields.hasErrors('password')} ? 'has-validation'">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           placeholder="At least 6 characters" data-testid="input-reg-password">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password *</label>
                <div class="input-group" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-validation'">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           placeholder="Re-enter your password" data-testid="input-reg-confirm">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" data-testid="register-submit">
                <i class="bi bi-person-plus me-1"></i>Create Account
            </button>
        </form>

        <p class="auth-foot">Already have an account?
            <a th:href="@{/login}" data-testid="go-login">Sign in</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
